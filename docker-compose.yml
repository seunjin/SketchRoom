services:
  postgres:
    image: postgres:17-alpine
    container_name: sketchroom-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: sketchroom
      POSTGRES_PASSWORD: sketchroom
      POSTGRES_DB: sketchroom
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
